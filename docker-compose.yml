version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: household-inventory-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: household_inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d household_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - household-network

  api:
    build: .
    container_name: household-inventory-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://user:password@postgres:5432/household_inventory
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - household-network
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:

networks:
  household-network:
    driver: bridge
